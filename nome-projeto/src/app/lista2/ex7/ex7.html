<h2>Exercício 7</h2>

<ul>
  <li
    *ngFor="
      let disciplina of disciplinas;
      let i = index;
      let primeiro = first;
      let ultimo = last;
      let par = even;
      let impar = odd
    "
    [ngClass]="{
      'fundo-par': par,
      'fundo-impar': impar,
      'primeira': primeiro,
      'ultima': ultimo
    }"
  >
    {{ disciplina }}
  </li>
</ul>
