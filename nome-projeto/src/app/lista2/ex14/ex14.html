<h2>Exercício 14</h2>

@for (produto of produtos; track produto.id) {

  <div>

    <p>
      {{ produto.nome }}
    </p>

    <p>
      Quantidade:
      {{ produto.quantidade }}
    </p>

    @if (produto.quantidade === 0) {

      <p>
        Sem estoque
      </p>

    } @else if (produto.quantidade <= 5) {

      <p>
        Estoque baixo
      </p>

    } @else {

      <p>
        Estoque disponível
      </p>

    }

  </div>

} @empty {

  <p>
    Nenhum produto cadastrado.
  </p>

}
